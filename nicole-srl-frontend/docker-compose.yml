services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nicole-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
